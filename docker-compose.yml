version: '3.9'

services:
  project:
    build:
      context: .
      args:
        - DEV=true
    ports:
      - "8000:8000"
    volumes:
      - ./project_root_directory:/project_root_directory
      - dev-static-data:/vol/web
      - dev-nomic-data:/vol/cache/gpt4all
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
      - NOMIC_DEFAULT_MODEL_PATH=/vol/cache/gpt4all
      - PGVECTOR_CONNECTION_STRING=postgresql://devuser:changeme@db:5432/devdb
    depends_on:
      - db
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - 11435:11434
    volumes:
      - dev-llama-data:/vol/cache/llama
    healthcheck:
      test: ollama list || exit 1
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    # command: >
    #   /bin/sh -c "ollama pull llama3 && ollama serve"
  
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
      - dev-db-wal:/wal
    command: >
      postgres -c wal_level=replica -c archive_mode=on
      -c "archive_command=test ! -f /wal/%f && cp %p /wal/%f"
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme

  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    depends_on:
      - db
    volumes:
      - dev-db-backups:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=30
      - BACKUP_KEEP_WEEKS=5
      - BACKUP_KEEP_MONTHS=6

  # Copies backups and archived WAL to a separate storage account/region.
  # Set BACKUP_OFFSITE_REMOTE (rclone remote:path) and the matching RCLONE_CONFIG_* variables.
  db-backup-offsite:
    image: rclone/rclone:latest
    depends_on:
      - db-backup
    entrypoint: /bin/sh
    command: >
      -c "while true; do
      rclone sync /backups $${BACKUP_OFFSITE_REMOTE}/dumps &&
      rclone sync /wal $${BACKUP_OFFSITE_REMOTE}/wal;
      sleep 86400; done"
    volumes:
      - dev-db-backups:/backups:ro
      - dev-db-wal:/wal:ro
    environment:
      - BACKUP_OFFSITE_REMOTE=${BACKUP_OFFSITE_REMOTE}

volumes:
  dev-db-wal:
  dev-db-backups:
  dev-db-data:
  dev-static-data:
  dev-nomic-data:
  dev-llama-data: